[package]
name = "delight-fixture"
description = "The plugin Delight's headless tests drive"
version = "0.0.7"
edition = "2024"
license = "MIT"
publish = false

# Its own workspace: it only builds for wasm32-wasip2.
[workspace]

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
# TEMPORARY(network): the `grpc` feature, prost and tonic-prost (gRPC's messages).
delight-plugin-api = { path = "../../crates/plugin-api", features = ["grpc"] }
log = "=0.4.33"
prost = "=0.14.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tonic-prost = "=0.14.6"

[profile.release]
lto = true
opt-level = "s"
strip = true

# GPUI's patches, as the root workspace has them: patches don't propagate.
[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
