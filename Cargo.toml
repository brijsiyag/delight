[workspace]
resolver = "3"
# The app's crates and the ones plugins share (manifest, protocol, plugin-api,
# ui). Each crate is added in the step that introduces it; see docs/plan.md. Plugins (built-in
# or not) are wasm32-wasip2 crates in their own workspaces.
members = [
    "crates/app",
    "crates/manifest",
    "crates/protocol",
    "crates/plugin-api",
    "crates/plugin-api-macros",
    "crates/runtime",
    "crates/ui",
    "tests",
    "xtask",
]

[workspace.package]
# The app's version: 0.1.0 is the first release. The crates plugins build against have their own
# version, which is the protocol version (see crates/manifest/Cargo.toml); it is 0.1.0 too.
version = "0.0.3"
edition = "2024"
license = "MIT"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

# Every dependency is declared once here, pinned exactly (`=x.y.z`, or a git
# `rev`), and crates use `{ workspace = true }`.
[workspace.dependencies]
delight-manifest = { path = "crates/manifest" }
delight-protocol = { path = "crates/protocol" }
delight-plugin-api-macros = { path = "crates/plugin-api-macros" }
delight-runtime = { path = "crates/runtime" }
delight-ui = { path = "crates/ui" }
# Upstream, at a commit: the app and every plugin (through delight-plugin-api) get
# exactly this one, wherever they're built. It brings GPUI (see docs/plan.md,
# Layout). To work on a change, point it at the checkout next to this repository
# with a `[patch."https://github.com/zed-industries/embedded_gpui.git"]` entry.
# The tip of its `surfaces-as-roots` branch, not yet merged into its `main` (see
# docs/plan.md, Later).
embedded_gpui = { git = "https://github.com/zed-industries/embedded_gpui.git", rev = "ceb0df8266592ddb4c5540c5f09ec10680f34c14" }
anyhow = "=1.0.103"
# TEMPORARY(network), down to `tower-service`: the app's HTTP for plugins, until embedded_gpui
# links `wasi:http` (README, "Temporary host APIs"). The versions already in
# the lock (GPUI, wasmtime): HTTP for plugins, the bytes that cross (base64), and the
# async runtime the app's HTTP runs on.
base64 = "=0.22.1"
# The version GPUI links, for the local time zone's offset from UTC.
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
bytes = "=1.12.0"
http = "=1.4.2"
http-body = "=1.0.1"
tokio = { version = "=1.52.3", default-features = false, features = ["rt-multi-thread", "net", "time", "sync"] }
# The app's HTTP/1.1 and HTTP/2, client and server, with TLS checked by macOS.
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", default-features = false, features = ["client", "server", "http1", "http2"] }
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1", "http2", "ring", "tls12", "rustls-platform-verifier"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["client-legacy", "server", "server-auto", "http1", "http2", "tokio"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
# gRPC in plugins (the plugin API's `grpc` feature): tonic's client over the app's HTTP.
tonic = { version = "=0.14.6", default-features = false, features = ["codegen"] }
tower-service = "=0.3.3"
# Sparkle's release is an .xz archive.
lzma-rs = "=0.3.0"
sha2 = "=0.10.9"
tar = "=0.4.46"
# Reading the versions in Cargo.toml files.
toml = { version = "=0.8.23", default-features = false, features = ["parse"] }
# Certificates are checked by macOS (as the app's HTTP does), so a company proxy's CA works.
ureq = { version = "=3.4.2", features = ["platform-verifier"] }
# Attribute parsing for the plugin API's proc macros.
darling = "=0.23.0"
dirs = "=6.0.0"
# `cargo xtask wasi-sdk`: fetch the pinned SDK, check it and unpack it.
flate2 = "=1.1.9"
env_logger = { version = "=0.11.8", default-features = false, features = ["auto-color", "humantime"] }
futures = "=0.3.32"
global-hotkey = "=0.8.0"
# The version GPUI links, for rasterising logos.
image = { version = "=0.25.10", default-features = false }
# Named exactly as embedded_gpui names it, or Cargo links a second GPUI (see
# docs/plan.md, Layout); Cargo.lock pins the commit.
gpui = { git = "https://github.com/zed-industries/zed.git", branch = "gpui-multi-root-embedded-rebased", version = "=0.2.2", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", branch = "gpui-multi-root-embedded-rebased", features = ["font-kit"] }
log = "=0.4.33"
# The versions tray-icon links.
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
    "std", "NSAnimation", "NSAppearance", "NSApplication", "NSBezierPath", "NSColor", "NSEvent",
    "NSGlassEffectView", "NSGraphics", "NSImage", "NSResponder", "NSRunningApplication", "NSView",
    "NSVisualEffectView", "NSWindow", "NSWorkspace", "libc", "objc2-quartz-core",
] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSString", "NSURL"] }
# Zipping the log files for the menu's Open Logs.
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
# Writing the open-at-login LaunchAgent.
plist = "=1.10.1"
# Plugin secrets: AES-256-GCM (`ring`), with the key in the login Keychain.
ring = "=0.17.14"
security-framework = "=3.7.0"
proc-macro2 = "=1.0.106"
# The version GPUI links: the NSView behind a GPUI window.
raw-window-handle = "=0.6.2"
quote = "=1.0.46"
# GPUI's version; no features of its own, so GPUI's build of it is reused.
resvg = { version = "=0.46.0", default-features = false }
smallvec = "=1.15.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
syn = "=2.0.118"
# The Mac's DNS setup, read without running a program: macOS's configuration store,
# and the `/etc/resolver/` files (resolv.conf's format).
system-configuration = "=0.8.0"
resolv-conf = "=0.7.6"
# Syntax highlighting in the built-ins (delight-ui's `code` feature).
tree-sitter = "=0.25.10"
tree-sitter-highlight = "=0.25.10"
tree-sitter-json = "=0.24.8"
tree-sitter-yaml = "=0.7.2"
tray-icon = "=0.25.1"
unicode-segmentation = "=1.13.3"
# Waiting for a plugin's program to end, for a limited time.
wait-timeout = "=0.2.1"
# The versions wasmtime (inside embedded_gpui) uses, with only the features it
# already enables: reading a plugin's custom section, and writing test components.
wasm-encoder = "=0.236.1"
wasmparser = { version = "=0.236.1", default-features = false, features = ["std", "component-model"] }
# The version inside embedded_gpui: the plugin sandbox's folder permissions.
wasmtime-wasi = "=36.0.12"

[profile.release]
codegen-units = 1
strip = true

# Compiling plugins is unusably slow when wasmtime itself is unoptimised, as
# embedded_gpui's own workspace notes.
[profile.dev.package.wasmtime]
opt-level = 3
[profile.dev.package.wasmtime-environ]
opt-level = 3
[profile.dev.package.cranelift-codegen]
opt-level = 3

# GPUI's patches, as embedded_gpui has them: patches don't propagate through
# git dependencies.
[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
