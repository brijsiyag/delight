[package]
name = "delight-ui"
description = "Delight's UI kit, for the app and its built-in tools: the theme, icons and font, components and the text editor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
# Highlighted code and a converting tool's result: tree-sitter, which is C (for
# plugins, built with the WASI SDK; see CONTRIBUTING.md). Only the built-ins that show
# code turn it on.
code = ["dep:tree-sitter", "dep:tree-sitter-highlight", "dep:tree-sitter-json", "dep:tree-sitter-yaml"]

[dependencies]
delight-protocol = { workspace = true }
gpui = { workspace = true }
image = { workspace = true }
log = { workspace = true }
resvg = { workspace = true }
smallvec = { workspace = true }
tree-sitter = { workspace = true, optional = true }
tree-sitter-highlight = { workspace = true, optional = true }
tree-sitter-json = { workspace = true, optional = true }
tree-sitter-yaml = { workspace = true, optional = true }
unicode-segmentation = { workspace = true }
