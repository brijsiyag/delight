  <!-- Delight's logo for the menu bar: two rings, cut so that a way runs from the top into
       the dot at the centre. Black on transparent, so macOS can tint it as a template image.
       Drawn for 36 px (18 pt at 2x): 16 pt across, rings 3.8 px wide with 2.4 px between them,
       and the notches 4 px with their edges on whole pixels. -->
