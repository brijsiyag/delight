    <path d="M16 2.13A16 16 0 0 0 16 33.87L16 30.03A12.2 12.2 0 0 1 16 5.97Z"/>
    <path d="M27.59 16A9.8 9.8 0 1 0 27.59 20L23.66 20A6 6 0 1 1 23.66 16Z"/>
    <circle cx="18" cy="18" r="3.8"/>
  </g>
</svg>
