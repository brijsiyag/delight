[package]
name = "delight-runtime"
description = "Delight's plugins without windows: what a plugin file is, which tools fit an input, and running plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
# TEMPORARY(network): bytes, futures, http, http-body-util, hyper*, rustls, tokio.
bytes = { workspace = true }
# With `files`: reading a plugin's `.wasm`, and its releases' feed.
delight-manifest = { workspace = true, features = ["files"] }
delight-protocol = { workspace = true }
embedded_gpui = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-rustls = { workspace = true }
hyper-util = { workspace = true }
log = { workspace = true }
resolv-conf = { workspace = true }
system-configuration = { workspace = true }
rustls = { workspace = true }
# Plugin updates: fetching a feed and a release (blocking, off the main thread), and checking it.
sha2 = { workspace = true }
tokio = { workspace = true }
ureq = { workspace = true }
wait-timeout = { workspace = true }
wasmtime-wasi = { workspace = true }

[dev-dependencies]
# A plugin's `.wasm`, for the update tests.
wasm-encoder = { workspace = true }
