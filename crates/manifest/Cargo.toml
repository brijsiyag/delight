[package]
name = "delight-manifest"
description = "What a Delight plugin's .wasm says about itself: its protocol version and manifest"
# The plugin API's version, shared by the crates plugins build against
# (delight-manifest, delight-protocol, delight-plugin-api and its macros), which
# are released together; its major.minor is the protocol version (see
# src/version.rs). Not the app's version.
version = "2.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
