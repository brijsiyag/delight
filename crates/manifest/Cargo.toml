[package]
name = "delight-manifest"
description = "What a Delight plugin's .wasm says about itself: its protocol version and manifest"
# The plugin API's version, shared by the crates plugins build against
# (delight-manifest, delight-protocol, delight-plugin-api and its macros), which
# are released together; its major.minor is the protocol version (see
# src/version.rs). Not the app's version.
version = "0.4.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
# Reading a plugin's `.wasm` (`read_manifest`), and reading and writing the files where plugins
# are published (`Release`, `PluginList`): for the app and for publishing tools, such as
# delight-plugins' `cargo xtask publish`. Off for the plugin API's macros, which build natively for
# every plugin.
files = ["dep:quick-xml", "dep:semver", "dep:wasmparser"]

[dependencies]
anyhow = { workspace = true }
quick-xml = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasmparser = { workspace = true, optional = true }

[dev-dependencies]
wasm-encoder = { workspace = true }
