[package]
name = "delight-plugin-api"
description = "What a Delight plugin is written with"
# The plugin API's version: always the same as delight-manifest's.
version = "0.0.2"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
# TEMPORARY(network): gRPC with tonic's generated clients (`network::grpc`), over the app's HTTP/2.
grpc = ["dep:tonic", "dep:tower-service", "dep:http-body", "dep:http-body-util", "dep:bytes"]

[dependencies]
anyhow = { workspace = true }
delight-protocol = { workspace = true }
delight-plugin-api-macros = { workspace = true }
embedded_gpui = { workspace = true }
# TEMPORARY(network): `futures` and `http`, and the optional ones below.
futures = { workspace = true }
http = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true, optional = true }
http-body = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tower-service = { workspace = true, optional = true }
